# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8081}
spring.application.name=auth-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${RENDER_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/booknest_auth?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:prateek@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.booknest=DEBUG

# ===============================
# JWT Custom Properties
# ===============================
jwt.secret=${JWT_SECRET:booknestSecretKeybooknestSecretKeybooknestSecretKey}
jwt.expiration=${JWT_EXPIRATION:3600000}   # 1 hour in milliseconds

# Actuator / Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/auth/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/auth/swagger-ui.html

# ===============================
# Redis / Session Configuration
# ===============================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.namespace=booknest:session
# Default session timeout (30 minutes)
server.servlet.session.timeout=30m

