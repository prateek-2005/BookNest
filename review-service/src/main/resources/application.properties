spring.application.name=review-service
server.port=8086

# MySQL Config
spring.datasource.url=jdbc:mysql://localhost:3306/booknest_review?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=prateek@2005

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Actuator / Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/reviews/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/reviews/swagger-ui.html

